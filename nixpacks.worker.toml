# Nixpacks configuration for Railway - Worker Service (consumer only)
# Pops jobs from Redis, runs guards + ML, writes to Supabase. Backend API pushes to Redis.

[phases.setup]
aptPkgs = ["python3", "python3-pip", "python3-venv"]

[phases.install]
cmds = [
  "python3 -m venv /app/venv",
  "/app/venv/bin/pip install -r requirements.txt"
]

[phases.build]
cmds = []

[start]
cmd = "cd /app && PYTHONPATH=/app /app/venv/bin/python -m src.worker"
