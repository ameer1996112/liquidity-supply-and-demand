# Nixpacks configuration for Railway - Worker Service
# This runs the queue consumer with AI Guardian (worker.py)

[phases.setup]
aptPkgs = ["python3", "python3-pip", "python3-venv"]

[phases.install]
cmds = [
  "python3 -m venv /app/venv",
  "/app/venv/bin/pip install -r backend/requirements.txt"
]

[phases.build]
cmds = []

[start]
cmd = "cd backend && /app/venv/bin/python worker.py"
