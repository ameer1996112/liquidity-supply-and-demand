# Nixpacks configuration for Railway - Worker Service
# Runs the queue consumer (src.worker). Use start.sh for API+Worker together, or this for worker-only.

[phases.setup]
aptPkgs = ["python3", "python3-pip", "python3-venv"]

[phases.install]
cmds = [
  "python3 -m venv /app/venv",
  "/app/venv/bin/pip install -r requirements.txt"
]

[phases.build]
cmds = []

[start]
cmd = "chmod +x start.sh && ./start.sh"
