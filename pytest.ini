[pytest]
# Test discovery
testpaths = tests
pythonpath = .
python_files = test_*.py
python_functions = test_*

# Markers for test categorization
markers =
    unit: Unit tests (no network, fast)
    integration: Integration tests (requires Redis, may need containers)
    e2e: End-to-end tests (full webhook -> worker -> ledger flow)
    slow: Slow running tests (burst tests, stress tests)

# Default: run unit tests only
addopts = -v --tb=short

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s

# Environment
env =
    TRINITY_ENV=test
