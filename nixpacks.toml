# Nixpacks configuration for Railway - Backend API Service (API only)
# Receives webhooks and pushes to Redis. Worker service consumes from Redis.

[phases.setup]
aptPkgs = ["python3", "python3-pip", "python3-venv"]

[phases.install]
cmds = [
  "python3 -m venv /app/venv",
  "/app/venv/bin/pip install -r requirements.txt"
]

[phases.build]
cmds = []

[start]
cmd = "cd /app && PYTHONPATH=/app /app/venv/bin/python -m uvicorn src.api:app --host 0.0.0.0 --port ${PORT:-8000}"
