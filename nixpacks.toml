# Nixpacks configuration for Railway - Backend Service
# Installs Python dependencies from backend/requirements.txt
# Start command is defined in railway.json (start.sh)

[phases.setup]
nixPkgs = ["python311"]

[phases.install]
cmds = ["pip install -r backend/requirements.txt"]

# No build phase needed for Python
[phases.build]
cmds = []

# Start command is handled by railway.json -> start.sh
# This is left empty so railway.json takes precedence
