# Nixpacks configuration for Railway - Backend API Service
# Runs FastAPI webhook receiver (src.api). start.sh runs API + Worker; override start for API-only.

[phases.setup]
aptPkgs = ["python3", "python3-pip", "python3-venv"]

[phases.install]
cmds = [
  "python3 -m venv /app/venv",
  "/app/venv/bin/pip install -r requirements.txt"
]

[phases.build]
cmds = []

[start]
cmd = "chmod +x start.sh && ./start.sh"
