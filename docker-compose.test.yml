version: "3.8"

# Docker Compose for Testing Infrastructure
# Provides Redis (and optionally Postgres) for integration/E2E tests
#
# Usage:
#   docker compose -f docker-compose.test.yml up -d
#   pytest -m integration
#   docker compose -f docker-compose.test.yml down

services:
  redis:
    image: redis:7-alpine
    container_name: trading_test_redis
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # Optional: PostgreSQL for full ledger testing
  # Uncomment if you want to test with a real database
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: trading_test_postgres
  #   ports:
  #     - "5432:5432"
  #   environment:
  #     POSTGRES_DB: trading_test
  #     POSTGRES_USER: test
  #     POSTGRES_PASSWORD: test
  #   volumes:
  #     - trading_test_pgdata:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U test"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 5
  #   restart: unless-stopped

networks:
  default:
    name: trading_test_network

